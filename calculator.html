<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Международный аэропорт | Онлайн-табло и информация для пассажиров</title>
        <link href="style.css" rel="stylesheet">
        <link rel="icon" href="img/airport.png" type="image/png">
    </head>
    <body>
        <header>
            <nav class="header-menu">
                <a href="#" class="logo-link">
                    <img class="logo" width="40" height="40" src="img/airport.png" alt="airport-building"/>
                </a>
                <ul>
                    <li><a href="main-page.html"><span>Об аэропорте</span></a></li>
                    <li><a href="#"><span>Расчет багажа</span></a></li>
                    <li><a href="index.html"><span>Маршруты</span></a></li>
                    <li><a href="author.html"><span>Об авторе</span></a></li>
                </ul>
                    <img class="theme-changer" src="img/moon.png" alt="Смена темы" width="40" height="40">
                    <button class="button-menu">Меню</button>
            </nav>
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="dropdown-menu-head">
                    <div class="dropdown-menu-title">Меню</div>
                    <button class="button-close">Закрыть</button>
                </div>
                <a href="main-page.html">Об аэропорте</a>
                <a href="#">Расчет багажа</a>
                <a href="index.html">Маршруты</a>
                <a href="author.html">Об авторе</a>
            </div>
        </header>
        <main>
            <div class="background-img">
                <img src="img/background-1.png" alt="background" class="bg-img active"/>
                <img src="img/background-2.png" alt="background" class="bg-img"/>
                <img src="img/background-3.png" alt="background" class="bg-img"/>
            </div>
            <div class="content">
                <p>Расчет веса багажа</p>
                <div>
                    <div class="calculator_container">
                        <div id="history" class="history"></div>
                        <div id="result" class="result">
                          0
                        </div>
                        <div>
                            <div>
                                <button id="btn_op_clear" class="my-btn secondary">C</button>
                                <button id="btn_op_sign" class="my-btn secondary">+/-</button>
                                <button id="btn_op_percent" class="my-btn secondary">%</button>
                                <button id="btn_op_div" class="my-btn primary">/</button>
                            </div>

                            <div>
                                <button id="btn_digit_7" class="my-btn">7</button>
                                <button id="btn_digit_8" class="my-btn">8</button>
                                <button id="btn_digit_9" class="my-btn">9</button>
                                <button id="btn_op_mult" class="my-btn primary">x</button>
                            </div>

                            <div>
                                <button id="btn_digit_4" class="my-btn">4</button>
                                <button id="btn_digit_5" class="my-btn">5</button>
                                <button id="btn_digit_6" class="my-btn">6</button>
                                <button id="btn_op_minus" class="my-btn primary">-</button>
                            </div>

                            <div>
                                <button id="btn_digit_1" class="my-btn">1</button>
                                <button id="btn_digit_2" class="my-btn">2</button>
                                <button id="btn_digit_3" class="my-btn">3</button>
                                <button id="btn_op_plus" class="my-btn primary">+</button>
                            </div>

                            <div>
                                <button id="btn_digit_0" class="my-btn">0</button>
                                <button id="btn_digit_dot" class="my-btn">.</button>
                                <button id="btn_op_equal" class="my-btn primary execute">=</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <div class="footer-content">
                <a href="#" class="logo-link">
                    <img class="logo" width="96" height="96" src="img/airport.png" alt="airport-building"/>
                </a>
                <ul>
                    <li><a href="main-page.html"><span>Об аэропорте</span></a></li>
                    <li><a href="#"><span>Расчет багажа</span></a></li>
                    <li><a href="index.html"><span>Маршруты</span></a></li>
                    <li><a href="author.html"><span>Об авторе</span></a></li>
                </ul>
            </div>
        </footer>
            <script src="js/app.js" defer></script>
        </body>
</html>
